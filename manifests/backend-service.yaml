apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: demo-app
  labels:
    app: demo
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: demo
    tier: backend
  ports:
  - name: http
    port: 8080        # Service port (what other services use to connect)
    targetPort: 8080  # Container port (what the app listens on)
    protocol: TCP
