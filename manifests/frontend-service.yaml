apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo-app
  labels:
    app: demo
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: demo
    tier: frontend
  ports:
  - name: http
    port: 80        # Service port (what other services use to connect)
    targetPort: 80  # Container port (what the app listens on)
    protocol: TCP
